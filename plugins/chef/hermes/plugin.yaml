name: chef
version: 0.9.2
description: Chef missions and guarded current-session execution for Hermes on macOS and Linux
kind: standalone
provides_tools:
  - chef_slot
  - chef_delegate
  - chef_worker_status
  - chef_research_read
  - chef_worker_read
  - chef_worker_write
  - chef_worker_shell
provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - pre_verify
  - subagent_start
  - subagent_stop
