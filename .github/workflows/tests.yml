name: Synthetic validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermes-native:
    name: Hermes native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned public Hermes host
        shell: bash
        run: |
          git init "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-agent" fetch --depth 1 origin 6d54f96ed213a700f69b25826c65b158e9e57cad
          git -C "$RUNNER_TEMP/hermes-agent" checkout --detach FETCH_HEAD
          python -m pip install -r requirements-dev.txt
          python -m pip install -e "$RUNNER_TEMP/hermes-agent"
          # Hermes keeps Python <3.14 as an updater bridge and omits its
          # runtime dependencies there. Install the provider-free host subset
          # exercised by this native plugin contract explicitly.
          python -m pip install 'ruamel.yaml>=0.18,<0.19' 'rich>=14,<15' 'python-dotenv>=1,<2' 'PyYAML>=6,<7' 'requests>=2,<3' 'jinja2>=3,<4' 'typing-extensions>=4,<5' 'pydantic>=2,<3'
      - name: Verify real native plugin and task context without providers
        shell: bash
        run: HERMES_AGENT_SOURCE="$RUNNER_TEMP/hermes-agent" python -m pytest -q -p no:cacheprovider tests/integration/hermes/test_native_host.py
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Isolate runtime homes
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          paths = {'HAN_ADAPTERS_DIR': 'chef-empty-registry', 'CODEX_HOME': 'chef-codex-home',
                   'CLAUDE_CONFIG_DIR': 'chef-claude-home', 'GROK_HOME': 'chef-grok-home'}
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, name in paths.items():
                  path = root / name
                  path.mkdir(exist_ok=True)
                  output.write(f'{key}={path}\n')
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check shared runtime contracts
        id: shared
        run: python tools/check_shared.py
      - name: Check package and deployment boundaries
        run: python tools/check_architecture.py
      - name: Check generated runtime entry points
        run: python tools/generate_entrypoints.py
      - name: Run full synthetic suite
        if: ${{ !cancelled() }}
        id: pytest
        run: python -m pytest -q -p no:cacheprovider --junitxml=test-results.xml
      - name: Publish test summary
        if: always()
        env:
          SHARED_RESULT: ${{ steps.shared.outcome }}
          PYTEST_RESULT: ${{ steps.pytest.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          lines = ['## Synthetic validation', '',
                   f"Shared contracts: {os.environ['SHARED_RESULT']}",
                   f"Pytest step: {os.environ['PYTEST_RESULT']}", '']
          report = Path('test-results.xml')
          if report.exists():
              suites = list(ET.parse(report).getroot().iter('testsuite'))
              counts = {key: sum(int(s.get(key, 0)) for s in suites)
                        for key in ('tests', 'failures', 'errors', 'skipped')}
              lines.append(' | '.join(f'{key}: {value}' for key, value in counts.items()))
          else:
              lines.append('JUnit report unavailable; inspect the failed setup or test step.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('\n'.join(lines) + '\n')
          PY
        shell: bash
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: warn
